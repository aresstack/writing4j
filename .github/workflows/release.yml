name: Release to Maven Central
# Tag push v<version>, or manually: Actions › Release to Maven Central › Run workflow on main with the version (e.g.
# 0.1.0); the manual run creates tag and GitHub release itself. Knowledge4j of the same knowledge4jVersion must be on
# Maven Central first. Versions on Maven Central are final. Only with the explicit release of the product owner.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (no SNAPSHOT)'
        type: string
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify release tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version exists already"; exit 1
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify libraries
        run: bash gradlew --no-daemon clean build -PreleaseVersion=${{ steps.version.outputs.version }}
      - name: Sign release bundle
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          bash gradlew --no-daemon zipAggregation -PreleaseVersion=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ steps.version.outputs.version }}
          path: build/nmcp/zip/aggregation.zip
          if-no-files-found: error
      - name: Publish signed bundle
        env:
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_centralUsername"
          test -n "$ORG_GRADLE_PROJECT_centralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          bash gradlew --no-daemon publishAggregationToCentralPortal -PreleaseVersion=${{ steps.version.outputs.version }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Writing4j ${{ steps.version.outputs.version }}"
          else
            gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes --title "Writing4j ${{ steps.version.outputs.version }}"
          fi
