name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Knowledge4j comes from Maven Central (knowledge4jVersion in build.gradle).
      - uses: actions/checkout@v4
        with:
          path: writing4j
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: writing4j
        run: bash gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: 'writing4j/**/build/test-results/test/'
          if-no-files-found: ignore
